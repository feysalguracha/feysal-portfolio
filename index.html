<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feysal Guracha | Full Stack Developer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        h2 { font-size: 1.2em; margin-bottom: 20px; opacity: 0.9; }
        .btn {
            display: inline-block;
            margin: 15px 0;
            padding: 14px 28px;
            background: #ffd700;
            color: #764ba2;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .projects {
            margin-top: 30px;
            text-align: left;
        }
        .project-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            margin: 12px 0;
        }
        .project-card a {
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hi, I'm Feysal 👋</h1>
        <h2>Full Stack Developer | Nairobi, KE</h2>
        <p>Welcome to my portfolio! I build responsive websites and web apps.</p>

        <a href="https://www.freecodecamp.org/feysalguracha" target="_blank" class="btn">
            View All My freeCodeCamp Certifications
        </a>

        <div class="projects">
            <h3>Featured Certifications</h3>
            <div class="project-card">
                <a href="https://www.freecodecamp.org/certification/feysalguracha/responsive-web-design" target="_blank">1. Responsive Web Design</a>
            </div>
            <div class="project-card">
                <a href="https://www.freecodecamp.org/certification/feysalguracha/javascript-algorithms-and-data-structures-v8" target="_blank">2. JavaScript Algorithms & Data Structures</a>
            </div>
            <div class="project-card">
                <a href="https://www.freecodecamp.org/certification/feysalguracha/front-end-development-libraries" target="_blank">3. Front End Development Libraries</a>
            </div>
        </div>
    </div>
</body>
</html>
